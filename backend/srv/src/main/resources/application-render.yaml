spring:
  config:
    activate:
      on-profile: render
  datasource:
    url: jdbc:h2:file:/app/data/pipeline;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:h2-init.sql

app:
  jwt-secret: ${JWT_SECRET}
  allowed-origin: ${ALLOWED_ORIGIN}
  github-token: ${GITHUB_TOKEN:}
  github-token-secondary: ${GITHUB_TOKEN_SECONDARY:}
  github-api-url: ${GITHUB_API_URL:https://api.github.com}
  workflow-name: ${WORKFLOW_NAME:}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD}
