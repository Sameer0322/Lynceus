databases:
  - name: pipeline-db
    databaseName: pipeline
    user: pipeline

services:
  - type: web
    name: lynceaus-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: JDBC_DATABASE_URL
        fromDatabase:
          name: pipeline-db
          property: jdbcConnectionString
      - key: GITHUB_TOKEN
        sync: false          # required — your GitHub Personal Access Token
      - key: GITHUB_TOKEN_SECONDARY
        sync: false          # optional — second PAT for rate-limit failover
      - key: GITHUB_API_URL
        value: https://api.github.com
      - key: WORKFLOW_NAME
        value: ""
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGIN
        sync: false          # required — set to your Vercel frontend URL (e.g. https://my-dashboard.vercel.app)
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false          # required — set your admin password manually in the Render dashboard
